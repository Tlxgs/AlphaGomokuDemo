<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>五子棋 AI</title>
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.0/dist/ort.min.js">
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #2b2b3a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }
        .app {
            background: #3d3d52;
            border-radius: 30px;
            padding: 32px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            gap: 36px;
            flex-wrap: wrap;
            align-items: flex-start;
        }
        .board-wrapper {
            background: #d9b382;
            border-radius: 22px;
            padding: 18px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.3), 0 8px 16px rgba(0, 0, 0, 0.4);
        }
        canvas#boardCanvas {
            display: block;
            border-radius: 8px;
            cursor: pointer;
            background: #dcb35c;
            width: 700px;
            height: 700px;
            box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
        }
        .panel {
            background: #4a4a62;
            border-radius: 20px;
            padding: 24px 26px;
            min-width: 260px;
            max-width: 300px;
            color: #eee;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .panel h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #f0e6d0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 12px;
            margin-bottom: 2px;
        }
        .panel .status {
            background: #35354a;
            border-radius: 12px;
            padding: 14px 16px;
            text-align: center;
            font-size: 17px;
            font-weight: 500;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #c8d0e0;
            border-left: 4px solid #6a8caf;
        }
        .panel .status .win {
            color: #6fcf97;
        }
        .panel .status .lose {
            color: #f28b82;
        }
        .param-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .param-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
            color: #c0c8d8;
        }
        .param-row select,
        .param-row input[type="radio"] {
            accent-color: #8ab4d6;
            background: #2e2e44;
            color: #eee;
            border: 1px solid #5a5a7a;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .param-row .radio-group {
            display: flex;
            gap: 12px;
        }
        .param-row .radio-group label {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }
        .btn {
            flex: 1;
            background: #5a5a7a;
            border: none;
            border-radius: 10px;
            padding: 12px 0;
            font-size: 16px;
            font-weight: 600;
            color: #eee;
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
            box-shadow: 0 4px 0 #2e2e44;
        }
        .btn:hover {
            background: #6e6e92;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #2e2e44;
        }
        .btn-primary {
            background: #4f7a9e;
            box-shadow: 0 4px 0 #2f4a62;
        }
        .btn-primary:hover {
            background: #5f8fb6;
        }
        .btn-danger {
            background: #9e5f5f;
            box-shadow: 0 4px 0 #623f3f;
        }
        .btn-danger:hover {
            background: #b67070;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #aab0c0;
            padding: 6px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        .info-row .label {
            color: #8890a0;
        }
        .info-row .value {
            color: #d0d8e8;
            font-weight: 500;
        }
        .model-status {
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            background: #35354a;
            text-align: center;
            color: #8a9aaa;
        }
        .model-status.loaded {
            color: #7bcfa6;
            background: #2a4a3a;
        }
        .model-status.error {
            color: #f28b82;
            background: #4a2a2a;
        }
        .winrate-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #b0b8c8;
        }
        .winrate-bar {
            flex: 1;
            height: 20px;
            background: #2e2e44;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            position: relative;
        }
        .winrate-bar .black {
            background: #2a2a2a;
            height: 100%;
            transition: width 0.2s;
            border-radius: 20px 0 0 20px;
        }
        .winrate-bar .white {
            background: #d0d0d0;
            height: 100%;
            transition: width 0.2s;
            border-radius: 0 20px 20px 0;
        }
        .winrate-bar .divider {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
        }
        .winrate-text {
            min-width: 90px;
            text-align: right;
            font-weight: 500;
            color: #d0d8e8;
        }
        @media (max-width: 1024px) {
            .app {
                flex-direction: column;
                align-items: center;
                padding: 20px;
            }
            .panel {
                min-width: unset;
                max-width: 700px;
                width: 100%;
            }
            canvas#boardCanvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1/1;
            }
        }
        @media (max-width: 480px) {
            .app {
                padding: 12px;
            }
            .panel {
                padding: 16px;
            }
            .btn {
                font-size: 14px;
                padding: 10px 0;
            }
            .param-row {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <div class="board-wrapper">
            <canvas id="boardCanvas" width="700" height="700"></canvas>
        </div>
        <div class="panel" id="panel">
            <h2>♟ 五子棋 AI</h2>
            <div class="status" id="statusDisplay"><span>⏳ 初始化中...</span></div>

            <div class="winrate-wrap">
                <span>⚫</span>
                <div class="winrate-bar" id="winrateBar">
                    <div class="black" id="winBlack" style="width:50%"></div>
                    <div class="white" id="winWhite" style="width:50%"></div>
                    <div class="divider"></div>
                </div>
                <span>⚪</span>
            </div>

            <div class="param-group">
                <div class="param-row">
                    <span>执子</span>
                    <select id="colorSelect">
                        <option value="black">黑棋 (先手)</option>
                        <option value="white">白棋 (后手)</option>
                    </select>
                </div>
                <div class="param-row">
                    <span>难度</span>
                    <div class="param-row">
                        <input type="range" id="simSlider" min="1" max="9" value="3" step="1" style="flex:1; accent-color:#8ab4d6; height:6px;">
                        <span id="simValue" style="min-width:36px;text-align:center;font-size:14px;color:#c0c8d8;">3</span>
                    </div>
                </div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="resetBtn">🔄 新游戏</button>
            </div>

            <div class="model-status" id="modelStatus">⏳ 等待 ONNX Runtime 加载...</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 常量 ----------
            const BOARD_SIZE = 15;
            const CANVAS_SIZE = 700;
            const CELL_SIZE = CANVAS_SIZE / (BOARD_SIZE + 1);
            const MARGIN = CELL_SIZE;

            const canvas = document.getElementById('boardCanvas');
            const ctx = canvas.getContext('2d');

            const statusEl = document.getElementById('statusDisplay');
            const winBlack = document.getElementById('winBlack');
            const winWhite = document.getElementById('winWhite');
            const winrateText = document.getElementById('winrateText');
            const colorSelect = document.getElementById('colorSelect');
            
            const resetBtn = document.getElementById('resetBtn');
            const modelStatusEl = document.getElementById('modelStatus');

            // ---------- 游戏类 ----------
            class GomokuGame {
                constructor(size = BOARD_SIZE) {
                    this.size = size;
                    this.reset();
                }
                reset() {
                    this.board = Array.from({ length: this.size }, () => Array(this.size).fill(0));
                    this.currentPlayer = 1;
                    this.winner = 0;
                    this.gameOver = false;
                    this.moveHistory = [];
                    this.lastMove = null;
                }
                copy() {
                    const g = new GomokuGame(this.size);
                    g.board = this.board.map(row => [...row]);
                    g.currentPlayer = this.currentPlayer;
                    g.winner = this.winner;
                    g.gameOver = this.gameOver;
                    g.moveHistory = [...this.moveHistory];
                    g.lastMove = this.lastMove ? [...this.lastMove] : null;
                    return g;
                }
                getLegalMoves() {
                    const moves = [];
                    for (let r = 0; r < this.size; r++) {
                        for (let c = 0; c < this.size; c++) {
                            if (this.board[r][c] === 0) moves.push([r, c]);
                        }
                    }
                    return moves;
                }
                getLegalMovesMask() {
                    const mask = new Float32Array(this.size * this.size);
                    for (let r = 0; r < this.size; r++) {
                        for (let c = 0; c < this.size; c++) {
                            mask[r * this.size + c] = this.board[r][c] === 0 ? 1 : 0;
                        }
                    }
                    return mask;
                }
                isLegalMove(r, c) {
                    return r >= 0 && r < this.size && c >= 0 && c < this.size && this.board[r][c] === 0;
                }
                makeMove(r, c) {
                    if (!this.isLegalMove(r, c) || this.gameOver) return false;
                    this.board[r][c] = this.currentPlayer;
                    this.lastMove = [r, c];
                    this.moveHistory.push([r, c, this.currentPlayer]);
                    if (this.checkWin(r, c)) {
                        this.winner = this.currentPlayer;
                        this.gameOver = true;
                    } else if (this.getLegalMoves().length === 0) {
                        this.winner = 0;
                        this.gameOver = true;
                    } else {
                        this.currentPlayer = -this.currentPlayer;
                    }
                    return true;
                }
                unsafeMakeMove(r, c) {
                    this.board[r][c] = this.currentPlayer;
                    this.lastMove = [r, c];
                    if (this.checkWin(r, c)) {
                        this.winner = this.currentPlayer;
                        this.gameOver = true;
                    } else if (this.getLegalMoves().length === 0) {
                        this.winner = 0;
                        this.gameOver = true;
                    } else {
                        this.currentPlayer = -this.currentPlayer;
                    }
                }
                checkWin(row, col) {
                    const player = this.board[row][col];
                    if (player === 0) return false;
                    const directions = [
                        [1, 0],
                        [0, 1],
                        [1, 1],
                        [1, -1]
                    ];
                    for (const [dx, dy] of directions) {
                        let count = 1;
                        for (let dir = -1; dir <= 1; dir += 2) {
                            for (let i = 1; i < 5; i++) {
                                const nr = row + dx * i * dir,
                                    nc = col + dy * i * dir;
                                if (nr < 0 || nr >= this.size || nc < 0 || nc >= this.size ||
                                    this.board[nr][nc] !== player) break;
                                count++;
                            }
                        }
                        if (count >= 5) return true;
                    }
                    return false;
                }
                getCanonicalState() {
                    const state = new Float32Array(2 * this.size * this.size);
                    const player = this.currentPlayer;
                    for (let r = 0; r < this.size; r++) {
                        for (let c = 0; c < this.size; c++) {
                            const val = this.board[r][c];
                            const idx = r * this.size + c;
                            if (val === player) state[idx] = 1;
                            else if (val === -player) state[this.size * this.size + idx] = 1;
                        }
                    }
                    return state;
                }
            }

            // ---------- MCTS 节点 ----------
            class MCTSNode {
                constructor(parent = null, priorProb = 1.0) {
                    this.parent = parent;
                    this.children = new Map();
                    this.priorProb = priorProb;
                    this.visitCount = 0;
                    this.valueSum = 0;
                    this.expanded = false;
                }
                getValue() {
                    return this.visitCount === 0 ? 0 : this.valueSum / this.visitCount;
                }
                isLeaf() {
                    return !this.expanded || this.children.size === 0;
                }
            }

            // ---------- MCTS ----------
            class MCTS {
                constructor(ortSession, config = {}) {
                    this.session = ortSession;
                    this.c_puct = 1.5;
                    this.numSimulations = config.numSimulations || 200;
                    this.temperature = 0.0;
                    this.boardSize = BOARD_SIZE;
                    this.root = null;
                    this.inputData = new Float32Array(1 * 2 * this.boardSize * this.boardSize);
                }

                async initRoot(game) {
                    const legalMoves = game.getLegalMoves();
                    if (legalMoves.length === 0) { this.root = null; return; }
                    const state = game.getCanonicalState();
                    const mask = game.getLegalMovesMask();
                    const { policy, value } = await this.inference(state, mask);
                    const moveProbs = {};
                    let total = 0;
                    for (const [r, c] of legalMoves) {
                        const idx = r * this.boardSize + c;
                        const prob = policy[idx];
                        moveProbs[`${r},${c}`] = prob;
                        total += prob;
                    }
                    if (total > 0) {
                        for (const key in moveProbs) moveProbs[key] /= total;
                    } else {
                        const p = 1 / legalMoves.length;
                        for (const [r, c] of legalMoves) moveProbs[`${r},${c}`] = p;
                    }
                    this.root = new MCTSNode();
                    this.root.expanded = true;
                    for (const [r, c] of legalMoves) {
                        const key = `${r},${c}`;
                        this.root.children.set(key, new MCTSNode(this.root, moveProbs[key]));
                    }
                }

                // ---- 修复：updateRoot 改为纯同步，不再异步调用 initRoot ----
                updateRoot(game, lastMove) {
                    if (!this.root) {
                        this.root = null;
                        return;
                    }
                    const key = `${lastMove[0]},${lastMove[1]}`;
                    if (this.root.children.has(key)) {
                        const newRoot = this.root.children.get(key);
                        newRoot.parent = null;
                        this.root = newRoot;
                    } else {
                        // 找不到对应子节点，标记为需要重新初始化
                        this.root = null;
                    }
                }

                async inference(state, mask) {
                    const data = this.inputData;
                    data.set(state);
                    const tensor = new ort.Tensor('float32', data, [1, 2, this.boardSize, this.boardSize]);
                    const feeds = { input: tensor };
                    const results = await this.session.run(feeds);
                    const policyLogits = results.policy_logits.data;
                    const value = results.value.data[0];
                    const logits = new Float32Array(policyLogits.length);
                    for (let i = 0; i < logits.length; i++) {
                        logits[i] = mask[i] === 0 ? -1e8 : policyLogits[i];
                    }
                    let maxLogit = -Infinity;
                    for (let i = 0; i < logits.length; i++) {
                        if (logits[i] > maxLogit) maxLogit = logits[i];
                    }
                    let sum = 0;
                    for (let i = 0; i < logits.length; i++) {
                        logits[i] = Math.exp(logits[i] - maxLogit);
                        sum += logits[i];
                    }
                    for (let i = 0; i < logits.length; i++) {
                        logits[i] /= sum;
                    }
                    return { policy: logits, value };
                }

                async simulate(game) {
                    let node = this.root;
                    const gameCopy = game.copy();
                    while (!node.isLeaf()) {
                        const [moveKey, child] = this.selectChild(node, gameCopy);
                        if (!child) {
                            this.backpropagate(node, 0);
                            return;
                        }
                        const [r, c] = moveKey.split(',').map(Number);
                        gameCopy.unsafeMakeMove(r, c);
                        node = child;
                    }
                    if (gameCopy.gameOver) {
                        const v = gameCopy.winner === 0 ? 0 : -1;
                        this.backpropagate(node, v);
                        return;
                    }
                    const state = gameCopy.getCanonicalState();
                    const mask = gameCopy.getLegalMovesMask();
                    const { policy, value } = await this.inference(state, mask);
                    const legalMoves = gameCopy.getLegalMoves();
                    const moveProbs = {};
                    let total = 0;
                    for (const [r, c] of legalMoves) {
                        const idx = r * this.boardSize + c;
                        const prob = policy[idx];
                        moveProbs[`${r},${c}`] = prob;
                        total += prob;
                    }
                    if (total > 0) {
                        for (const key in moveProbs) moveProbs[key] /= total;
                    } else {
                        const p = 1 / legalMoves.length;
                        for (const [r, c] of legalMoves) moveProbs[`${r},${c}`] = p;
                    }
                    node.expanded = true;
                    for (const [r, c] of legalMoves) {
                        const key = `${r},${c}`;
                        node.children.set(key, new MCTSNode(node, moveProbs[key]));
                    }
                    this.backpropagate(node, value);
                }

                selectChild(node, game) {
                    const children = node.children;
                    if (children.size === 0) return [null, null];
                    const legalKeys = [];
                    for (const key of children.keys()) {
                        const [r, c] = key.split(',').map(Number);
                        if (game.isLegalMove(r, c)) legalKeys.push(key);
                    }
                    if (legalKeys.length === 0) return [null, null];
                    let bestKey = legalKeys[0];
                    let bestScore = -Infinity;
                    const sqrtParent = Math.sqrt(1 + node.visitCount);
                    const parentValue = node.getValue();
                    for (const key of legalKeys) {
                        const child = children.get(key);
                        const visits = child.visitCount;
                        const qVal = visits === 0 ? parentValue : -child.getValue();
                        const uVal = this.c_puct * child.priorProb * sqrtParent / (1 + visits);
                        const score = qVal + uVal;
                        if (score > bestScore) {
                            bestScore = score;
                            bestKey = key;
                        }
                    }
                    return [bestKey, children.get(bestKey)];
                }

                backpropagate(node, value) {
                    let current = node;
                    let v = value;
                    while (current) {
                        current.visitCount++;
                        current.valueSum += v;
                        v = -v;
                        current = current.parent;
                    }
                }

                // ---- 修复：search 开头检查 root 是否为 null，并重新初始化 ----
                async search(game, onProgress = null) {
                    if (!this.root) {
                        await this.initRoot(game);
                        if (!this.root) return null;
                    }
                    const total = this.numSimulations;
                    const batchSize = 5;
                    for (let i = 0; i < total; i += batchSize) {
                        const end = Math.min(i + batchSize, total);
                        for (let j = i; j < end; j++) {
                            await this.simulate(game);
                        }
                        if (onProgress) {
                            const pct = Math.min(100, Math.round((end / total) * 100));
                            onProgress(pct);
                        }
                        await new Promise(r => setTimeout(r, 0));
                    }
                    return this.getBestMove(game);
                }

                getBestMove(game) {
                    if (!this.root || this.root.children.size === 0) return null;
                    const legalKeys = [];
                    for (const key of this.root.children.keys()) {
                        const [r, c] = key.split(',').map(Number);
                        if (game.isLegalMove(r, c)) legalKeys.push(key);
                    }
                    if (legalKeys.length === 0) return null;
                    let bestKey = legalKeys[0];
                    let bestVisits = -1;
                    for (const key of legalKeys) {
                        const visits = this.root.children.get(key).visitCount;
                        if (visits > bestVisits) {
                            bestVisits = visits;
                            bestKey = key;
                        }
                    }
                    const [r, c] = bestKey.split(',').map(Number);
                    return [r, c];
                }

                  getAvgValue() {
                  if (!this.root || this.root.children.size === 0) return 0;
                  let totalVisits = 0, weightedValue = 0;
                  for (const child of this.root.children.values()) {
                        totalVisits += child.visitCount;
                        weightedValue += child.getValue() * child.visitCount;
                  }
                  if (totalVisits === 0) return 0;
                  return weightedValue / totalVisits;
                  }
            }

            // ---------- 主应用 ----------
            class GomokuApp {
                constructor() {
                    this.game = new GomokuGame();
                    this.mcts = null;
                    this.isAIThinking = false;
                    this.isGameOver = false;
                    this.isModelReady = false;
                    this.history = [];
                    this.playerColor = 'black';

                    this.statusEl = statusEl;
                    this.winBlack = winBlack;
                    this.winWhite = winWhite;
                    this.winrateText = winrateText;
                    this.colorSelect = colorSelect;
                    this.modelStatusEl = modelStatusEl;
                    const simSlider = document.getElementById('simSlider');
                    const simValue = document.getElementById('simValue');

                    canvas.addEventListener('click', this.onCanvasClick.bind(this));
                    resetBtn.addEventListener('click', this.resetGame.bind(this));
                    colorSelect.addEventListener('change', () => { this.resetGame(); });

                    simSlider.addEventListener('input', () => {
                        simValue.textContent = simSlider.value;
                        if (this.mcts) {
                            this.mcts.numSimulations = 1+2**parseInt(simSlider.value);
                        }
                    });

                    this.draw();
                    this.updateStatus('⏳ 加载模型中...');
                    this.modelStatusEl.textContent = '⏳ 正在加载 ONNX 模型...';
                    this.loadModel();
                }

                async loadModel() {
                    try {
                        if (typeof ort === 'undefined') {
                            throw new Error('ONNX Runtime 未加载，请检查网络。');
                        }
                        const session = await ort.InferenceSession.create('distill_model.onnx', {
                            executionProviders: ['wasm'],
                            graphOptimizationLevel: 'all',
                        });

                        const simVal = 1+2**parseInt(document.getElementById('simSlider').value);
                        this.mcts = new MCTS(session, { numSimulations: simVal });
                        this.isModelReady = true;
                        this.modelStatusEl.textContent = '✅ 模型加载成功';
                        this.modelStatusEl.className = 'model-status loaded';
                        await this.resetGame();

                    } catch (err) {
                        console.error('模型加载失败:', err);
                        this.modelStatusEl.textContent = `❌ 模型加载失败: ${err.message || '未知错误'}`;
                        this.modelStatusEl.className = 'model-status error';
                        this.updateStatus('⚠️ 模型加载失败');
                        alert('加载失败，请确保:\n1. distill_model.onnx 与 HTML 同目录\n2. 使用本地服务器运行\n3. 网络可访问 CDN\n\n错误: ' + err.message);
                    }
                }

                  async resetGame() {
                  this.isAIThinking = false;
                  this.game.reset();
                  this.history = [];
                  this.isGameOver = false;

                  this.playerColor = this.colorSelect.value;
                  // ✅ 黑棋先手（始终为 1）
                  this.game.currentPlayer = 1;

                  if (this.mcts) {
                        const simVal = 1+2**parseInt(document.getElementById('simSlider').value);
                        this.mcts.numSimulations = simVal;
                        await this.mcts.initRoot(this.game);
                  }

                  this.draw();
                  this.updateWinRate();

                  // 如果玩家执白，AI 执黑先手，让 AI 走一步
                  if (this.playerColor === 'white' && !this.game.gameOver) {
                        await this.doAIMove();  // AI 会使用 currentPlayer=1（黑棋）
                  } else {
                        this.updateStatus('你的回合');
                  }
                  }

                onCanvasClick(event) {
                    if (this.isAIThinking) return;
                    if (this.isGameOver) return;
                    if (!this.isModelReady) return;

                    const isPlayerTurn = (this.playerColor === 'black' && this.game.currentPlayer === 1) ||
                        (this.playerColor === 'white' && this.game.currentPlayer === -1);
                    if (!isPlayerTurn) {
                        this.updateStatus('请等待 AI 思考...');
                        return;
                    }

                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width;
                    const scaleY = canvas.height / rect.height;
                    const x = (event.clientX - rect.left) * scaleX;
                    const y = (event.clientY - rect.top) * scaleY;
                    const col = Math.round((x - MARGIN) / CELL_SIZE);
                    const row = Math.round((y - MARGIN) / CELL_SIZE);
                    if (row < 0 || row >= BOARD_SIZE || col < 0 || col >= BOARD_SIZE) return;
                    if (!this.game.isLegalMove(row, col)) return;

                    this.doPlayerMove(row, col);
                }

                doPlayerMove(row, col) {
                    if (!this.game.isLegalMove(row, col)) return;
                    const playerBefore = this.game.currentPlayer;
                    this.game.makeMove(row, col);
                    this.history.push({ move: [row, col], player: playerBefore });
                    this.draw();

                    if (this.game.gameOver) {
                        this.handleGameOver();
                        return;
                    }

                    // 更新 MCTS 根节点
                    if (this.mcts) {
                        this.mcts.updateRoot(this.game, [row, col]);
                    }

                    if (!this.game.gameOver) {
                        this.doAIMove();
                    }
                }

                async doAIMove() {
                    if (this.isAIThinking) return;
                    if (this.isGameOver) return;
                    if (!this.mcts) return;

                    this.isAIThinking = true;
                    this.updateStatus('AI 思考中...');

                    try {
                        const legalMoves = this.game.getLegalMoves();
                        const aiPlayer = this.game.currentPlayer;
                        const opponent = -aiPlayer;

                        // 1. 直接获胜
                        for (const [r, c] of legalMoves) {
                            const test = this.game.copy();
                            test.board[r][c] = aiPlayer;
                            if (test.checkWin(r, c)) {
                                this.game.makeMove(r, c);
                                this.history.push({ move: [r, c], player: aiPlayer });
                                this.draw();
                                if (this.mcts) {
                                    this.mcts.updateRoot(this.game, [r, c]);
                                }
                                this.isAIThinking = false;
                                if (this.game.gameOver) {
                                    this.handleGameOver();
                                } else {
                                    this.updateStatus('你的回合');
                                    this.updateWinRate();
                                }
                                return;
                            }
                        }

                        // 2. 防守（对手下一步获胜）
                        for (const [r, c] of legalMoves) {
                            const test = this.game.copy();
                            test.board[r][c] = opponent;
                            if (test.checkWin(r, c)) {
                                this.game.makeMove(r, c);
                                this.history.push({ move: [r, c], player: aiPlayer });
                                this.draw();
                                if (this.mcts) {
                                    this.mcts.updateRoot(this.game, [r, c]);
                                }
                                this.isAIThinking = false;
                                if (this.game.gameOver) {
                                    this.handleGameOver();
                                } else {
                                    this.updateStatus('你的回合');
                                    this.updateWinRate();
                                }
                                return;
                            }
                        }

                        // 3. MCTS 搜索
                        const move = await this.mcts.search(this.game, null);
                        if (!move) {
                            this.isAIThinking = false;
                            this.updateStatus('⚠️ AI 无法找到合法走法');
                            return;
                        }
                        const [r, c] = move;
                        if (!this.game.isLegalMove(r, c)) {
                            this.isAIThinking = false;
                            this.updateStatus('⚠️ AI 选择了非法走法，请重试');
                            return;
                        }

                        this.game.makeMove(r, c);
                        this.history.push({ move: [r, c], player: aiPlayer });
                        this.draw();

                        if (this.mcts) {
                            this.mcts.updateRoot(this.game, [r, c]);
                        }
                        this.updateWinRate();
                        this.isAIThinking = false;

                        if (this.game.gameOver) {
                            this.handleGameOver();
                        } else {
                            this.updateStatus('你的回合');
                        }
                    } catch (err) {
                        console.error('AI 搜索错误:', err);
                        this.isAIThinking = false;
                        this.updateStatus('⚠️ AI 出错: ' + err.message);
                    }
                }

                handleGameOver() {
                    this.isGameOver = true;
                    const winner = this.game.winner;
                    if (winner === 1) {
                        if (this.playerColor === 'black') {
                            this.updateStatus('🎉 你赢了！');
                            this.statusEl.className = 'status win';
                        } else {
                            this.updateStatus('🤖 AI 赢了！');
                            this.statusEl.className = 'status lose';
                        }
                    } else if (winner === -1) {
                        if (this.playerColor === 'white') {
                            this.updateStatus('🎉 你赢了！');
                            this.statusEl.className = 'status win';
                        } else {
                            this.updateStatus('🤖 AI 赢了！');
                            this.statusEl.className = 'status lose';
                        }
                    } else {
                        this.updateStatus('🤝 平局！');
                        this.statusEl.className = 'status';
                    }
                    this.draw();
                }

                updateStatus(text) {
                    this.statusEl.innerHTML = text;
                    if (!text.includes('赢') && !text.includes('平局')) {
                        this.statusEl.className = 'status';
                    }
                }


                  updateWinRate() {
                  // 若 MCTS 未初始化或无访问记录，显示 50/50
                  if (!this.mcts || !this.mcts.root || this.mcts.root.visitCount === 0) {
                        this.winBlack.style.width = '50%';
                        this.winWhite.style.width = '50%';
                        return;
                  }

                  const root = this.mcts.root;
                  // 根节点视角的平均价值（范围 -1 ~ 1）
                  const avgValue = root.valueSum / root.visitCount;
                  // 根节点视角的胜率（0 ~ 1）
                  const curWinRate = (avgValue + 1) / 2;

                  // 计算黑棋胜率
                  let blackWinRate;
                  if (this.game.currentPlayer === 1) {
                        // 当前玩家是黑，黑胜率 = 当前玩家胜率
                        blackWinRate = curWinRate;
                  } else {
                        // 当前玩家是白，黑胜率 = 1 - 白胜率
                        blackWinRate = 1 - curWinRate;
                  }

                  // 边界限制
                  blackWinRate = Math.max(0, Math.min(1, blackWinRate));
                  const blackPct = Math.round(blackWinRate * 100);
                  const whitePct = 100 - blackPct;

                  this.winBlack.style.width = blackPct + '%';
                  this.winWhite.style.width = whitePct + '%';
                  }

                draw() {
                    const W = CANVAS_SIZE,
                        H = CANVAS_SIZE;
                    ctx.clearRect(0, 0, W, H);

                    const grad = ctx.createRadialGradient(W / 2, H / 2, 50, W / 2, H / 2, W * 0.7);
                    grad.addColorStop(0, '#e8c88a');
                    grad.addColorStop(1, '#c9a56a');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);

                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.shadowOffsetX = 0;
                    ctx.shadowOffsetY = 0;
                    ctx.strokeStyle = '#5a3e2b';
                    ctx.lineWidth = 0.8;
                    for (let i = 0; i < BOARD_SIZE; i++) {
                        const x = MARGIN + i * CELL_SIZE;
                        const y = MARGIN + i * CELL_SIZE;
                        ctx.beginPath();
                        ctx.moveTo(MARGIN, y);
                        ctx.lineTo(MARGIN + (BOARD_SIZE - 1) * CELL_SIZE, y);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x, MARGIN);
                        ctx.lineTo(x, MARGIN + (BOARD_SIZE - 1) * CELL_SIZE);
                        ctx.stroke();
                    }

                    const stars = [
                        [3, 3],
                        [11, 3],
                        [7, 7],
                        [3, 11],
                        [11, 11]
                    ];
                    ctx.fillStyle = '#5a3e2b';
                    for (const [r, c] of stars) {
                        const x = MARGIN + c * CELL_SIZE,
                            y = MARGIN + r * CELL_SIZE;
                        ctx.beginPath();
                        ctx.arc(x, y, 5, 0, 2 * Math.PI);
                        ctx.fill();
                    }

                    for (let r = 0; r < BOARD_SIZE; r++) {
                        for (let c = 0; c < BOARD_SIZE; c++) {
                            const val = this.game.board[r][c];
                            if (val === 0) continue;
                            const x = MARGIN + c * CELL_SIZE,
                                y = MARGIN + r * CELL_SIZE;
                            const radius = CELL_SIZE * 0.42;
                            const isBlack = val === 1;

                            ctx.shadowColor = 'rgba(0,0,0,0.3)';
                            ctx.shadowBlur = 8;
                            ctx.shadowOffsetX = 2;
                            ctx.shadowOffsetY = 2;

                            const grad2 = ctx.createRadialGradient(
                                x - radius * 0.3, y - radius * 0.3, radius * 0.1,
                                x, y, radius
                            );
                            if (isBlack) {
                                grad2.addColorStop(0, '#666');
                                grad2.addColorStop(0.7, '#1a1a1a');
                                grad2.addColorStop(1, '#000');
                            } else {
                                grad2.addColorStop(0, '#ffffff');
                                grad2.addColorStop(0.7, '#f0f0f0');
                                grad2.addColorStop(1, '#d0d0d0');
                            }
                            ctx.beginPath();
                            ctx.arc(x, y, radius, 0, 2 * Math.PI);
                            ctx.fillStyle = grad2;
                            ctx.fill();

                            ctx.shadowColor = 'transparent';
                            ctx.shadowBlur = 0;
                            ctx.shadowOffsetX = 0;
                            ctx.shadowOffsetY = 0;

                            if (!isBlack) {
                                ctx.strokeStyle = '#bbb';
                                ctx.lineWidth = 0.5;
                                ctx.stroke();
                            }
                        }
                    }

                    if (this.game.lastMove) {
                        const [lr, lc] = this.game.lastMove;
                        const x = MARGIN + lc * CELL_SIZE,
                            y = MARGIN + lr * CELL_SIZE;
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(255, 50, 50, 0.7)';
                        ctx.beginPath();
                        ctx.arc(x, y, 6, 0, 2 * Math.PI);
                        ctx.fill();
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                        ctx.beginPath();
                        ctx.arc(x, y, 3, 0, 2 * Math.PI);
                        ctx.fill();
                    }

                    if (this.game.gameOver) {
                        ctx.shadowColor = 'transparent';
                        ctx.shadowBlur = 0;
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fillRect(0, 0, W, H);
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 40px "Microsoft YaHei", sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.shadowColor = 'rgba(0,0,0,0.5)';
                        ctx.shadowBlur = 20;
                        const winner = this.game.winner;
                        let txt;
                        if (winner === 1) {
                              // 黑棋胜利
                              txt = (this.playerColor === 'black') ? '🏆 你赢了' : '🤖 AI 赢了';
                        } else if (winner === -1) {
                              // 白棋胜利
                              txt = (this.playerColor === 'white') ? '🏆 你赢了' : '🤖 AI 赢了';
                        } else {
                              txt = '🤝 平局';
                        }
                        ctx.fillText(txt, W / 2, H / 2);
                        ctx.shadowBlur = 0;
                        ctx.shadowColor = 'transparent';
                    }

                    ctx.shadowColor = 'transparent';
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = '#5a3e2b';
                    ctx.font = '12px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    for (let i = 0; i < BOARD_SIZE; i++) {
                        const x = MARGIN + i * CELL_SIZE;
                        ctx.fillText(String.fromCharCode(65 + i), x, 4);
                        ctx.textBaseline = 'middle';
                        ctx.fillText(BOARD_SIZE - i, 4, MARGIN + i * CELL_SIZE);
                        ctx.textBaseline = 'top';
                    }
                }
            }

            // ---------- 启动 ----------
            if (document.readyState === 'complete') {
                new GomokuApp();
            } else {
                window.addEventListener('load', () => {
                    new GomokuApp();
                });
            }

            if (typeof ort === 'undefined') {
                console.error('ONNX Runtime 未加载');
                document.getElementById('modelStatus').textContent = '❌ ONNX Runtime 加载失败';
                document.getElementById('modelStatus').className = 'model-status error';
            }

        })();
    </script>
